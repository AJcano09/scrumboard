<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="flex gap-3 overflow-x-auto" style="min-height: 70vh;">
  @for (column of board.columns; track column.id) {
    <div class="flex flex-column" style="min-width: 300px;">
      <div class="flex align-items-center justify-content-between mb-2">
        <h6 class="m-0">{{ column.name }}</h6>
        <button pButton icon="pi pi-plus" class="p-button-text p-button-sm" (click)="openCreateDialog(column.id)"></button>
      </div>

      <div
        cdkDropList
        [cdkDropListData]="column.tasks"
        [cdkDropListConnectedTo]="connectedLists()"
        (cdkDropListDropped)="onTaskDrop($event)"
        class="flex flex-column gap-2 p-2 border-round surface-100 flex-1">

        @for (task of column.tasks; track task.id) {
          <p-card cdkDrag class="cursor-move">
            <div class="flex justify-content-between align-items-start mb-2">
              <span class="font-medium">{{ task.title }}</span>
              <p-tag [value]="task.priority" [severity]="priorityColor(task.priority)"></p-tag>
            </div>
            <p class="text-sm text-color-secondary mb-2">{{ task.description }}</p>
            <div class="flex justify-content-between align-items-center">
              <span class="text-sm"><i class="pi pi-user mr-1"></i>{{ task.responsibleName }}</span>
              <div>
                <button pButton icon="pi pi-pencil" class="p-button-text p-button-sm" (click)="openEditDialog(task)"></button>
                <button pButton icon="pi pi-trash" class="p-button-text p-button-sm p-button-danger" (click)="confirmDeleteTask(task)"></button>
              </div>
            </div>
          </p-card>
        } @empty {
          <p class="text-color-secondary text-sm text-center py-3">Sin tareas</p>
        }
      </div>
    </div>
  }
</div>

<p-dialog [(visible)]="dialogVisible" [header]="editingTask ? 'Editar tarea' : 'Nueva tarea'" [modal]="true" [style]="{ width: '28rem' }">
  <form [formGroup]="form" class="flex flex-column gap-3">
    <div class="flex flex-column gap-2">
      <label for="title">Título</label>
      <input id="title" pInputText formControlName="title" />
    </div>
    <div class="flex flex-column gap-2">
      <label for="description">Descripción</label>
      <textarea id="description" pInputTextarea formControlName="description" rows="3"></textarea>
    </div>
    <div class="flex flex-column gap-2">
      <label for="priority">Prioridad</label>
      <p-dropdown id="priority" formControlName="priority" [options]="priorityOptions" optionLabel="label" optionValue="value"></p-dropdown>
    </div>
    <div class="flex flex-column gap-2">
      <label for="responsible">Responsable</label>
      <p-dropdown id="responsible" formControlName="responsibleId" [options]="users" optionLabel="name" optionValue="id"></p-dropdown>
    </div>
  </form>
  <ng-template pTemplate="footer">
    <button pButton label="Cancelar" class="p-button-text" (click)="dialogVisible = false"></button>
    <button pButton label="Guardar" (click)="save()"></button>
  </ng-template>
</p-dialog>
