services:
  api:
    build:
      context: .
      dockerfile: backend/ScrumBoard.Api/Dockerfile
    ports:
      - "${API_PORT:-5001}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: frontend/scrumboard-web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PROD_WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_started
